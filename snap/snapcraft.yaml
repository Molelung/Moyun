name: daily_you
version: 3.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-daily_you: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.daily_you # adjust accordingly to your app name

apps:
  daily_you:
    command: daily_you
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-daily_you
parts:
  daily_you:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
