name: daily_you
description: Every day is worth remembering...
publish_to: 'none'
version: 0.2.2+1012

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.2
  sqlite3_flutter_libs: ^0.6.0
  file_picker: ^11.0.2
  provider: ^6.0.5
  path: ^1.9.0
  permission_handler: ^12.0.0+1
  image_picker: ^1.0.0
  easy_debounce: ^2.0.3
  system_theme: ^3.1.2
  url_launcher: ^6.1.12
  icons_launcher: ^3.0.0
  flutter_local_notifications: ^21.0.0
  android_alarm_manager_plus: ^5.0.0
  flutter_colorpicker: ^1.0.3
  shared_storage:
    git:
      url: https://github.com/Demizo/shared-storage
      ref: f3b12b798a2d042a25659557ae7da47baae41701
  device_info_plus: ^12.4.0
  markdown_widget: ^2.3.2+8

  intl: ^0.20.0
  logging: ^1.3.0
  time_range_picker: ^2.3.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.2
  saf_util: ^2.1.0
  archive: ^4.0.7
  app_settings: ^7.0.0
  image: ^4.5.4
  flutter_cache_manager: ^3.4.1
  pool: ^1.5.1
  flutter_image_compress: ^2.4.0
  html2md: ^1.3.2
  media_scanner: ^2.2.0
  local_auth: ^3.0.1
  crypto: ^3.0.6
  word_count: ^1.0.4
  xml: ^6.6.1
  csv: ^8.0.0
  quick_actions: ^1.1.0
  flutter_displaymode: ^0.7.0
  dynamic_color: ^1.8.1
  uuid: ^4.5.3
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0
  scrollable_positioned_list: ^0.3.8
  flutter_animate: ^4.5.2
  encrypt: ^5.0.3
  flutter_spinkit: ^5.2.2
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/daily_you_First_Steps.webp
  fonts:
    - family: Courgette
      fonts:
        - asset: assets/fonts/Courgette-Regular.ttf
    - family: SotyrFangsong
      fonts:
        - asset: assets/fonts/SotyrFangsong-S2T-Regular.ttf
    - family: XuandongKaishu
      fonts:
        - asset: assets/fonts/XuandongKaishu.ttf

icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/logo_rectangle.png"
      notification_image: "assets/logo_notification.png"
      adaptive_background_image: "assets/logo_background.png"
      adaptive_foreground_image: "assets/logo_foreground.png"
      adaptive_round_image: "assets/logo.png"
      adaptive_monochrome_image: "assets/logo_monochrome.png"
    ios:
      enable: false
      image_path: "assets/logo_rectangle.png"
    macos:
      enable: false
      image_path: "assets/logo_border.png"
    windows:
      enable: false
      image_path: "assets/logo.png"
    linux:
      enable: true
      image_path: "assets/logo.png"
